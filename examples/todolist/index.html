<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Todo List - Tempo Example</title><style> :root { --primary-color: #3498db; --completed-color: #888; } * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; } .container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; } h1 { color: var(--primary-color); text-align: center; margin-bottom: 1.5rem; } .filters { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem; } .filter-btn { padding: 0.5rem 1rem; border: 2px solid var(--primary-color); background: white; color: var(--primary-color); border-radius: 4px; cursor: pointer; } .filter-btn.active { background: var(--primary-color); color: white; } .todo-list { list-style: none; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); } .todo-item { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border-bottom: 1px solid #eee; } .todo-item:last-child { border-bottom: none; } .todo-item.completed .todo-text { text-decoration: line-through; color: var(--completed-color); } .todo-item.priority-high { border-left: 4px solid #e74c3c; } .todo-checkbox { width: 1.25rem; height: 1.25rem; accent-color: var(--primary-color); } .todo-text { flex: 1; } .badge { font-size: 0.75rem; padding: 0.125rem 0.5rem; border-radius: 999px; } .badge-low { background: #dfe6e9; color: #636e72; } .badge-high { background: #fab1a0; color: #d63031; } .badge-urgent { background: #d63031; color: white; } .btn-delete { padding: 0.25rem 0.5rem; border: 1px solid #ddd; background: white; border-radius: 4px; cursor: pointer; } .btn-delete:disabled { opacity: 0.5; cursor: not-allowed; } .stats { text-align: center; margin-top: 1rem; color: #666; font-size: 0.875rem; } .empty-state { text-align: center; padding: 3rem; color: #999; } </style></head><body><div class="container"><h1>Todo List</h1><div class="filters"><button class="filter-btn active">All</button><button class="filter-btn">Active</button><button class="filter-btn">Completed</button></div><ul class="todo-list"><li class="todo-item completed" data-id="1"><input type="checkbox" class="todo-checkbox" checked/><span class="todo-text">Learn Odin programming</span><button class="btn-delete" disabled title="Cannot delete completed items">Delete </button></li><li class="todo-item priority-high" data-id="2"><input type="checkbox" class="todo-checkbox"/><span class="todo-text">Build something with tempo</span><span class="badge badge-high">High</span><button class="btn-delete" title="Delete this todo">Delete </button></li><li class="todo-item" data-id="3"><input type="checkbox" class="todo-checkbox"/><span class="todo-text">Write documentation</span><button class="btn-delete" title="Delete this todo">Delete </button></li><li class="todo-item" data-id="4"><input type="checkbox" class="todo-checkbox"/><span class="todo-text">Add more examples</span><span class="badge badge-low">Low</span><button class="btn-delete" title="Delete this todo">Delete </button></li><li class="todo-item" data-id="5"><input type="checkbox" class="todo-checkbox"/><span class="todo-text">Fix critical bug</span><span class="badge badge-urgent">Urgent</span><button class="btn-delete" title="Delete this todo">Delete </button></li><li class="todo-item completed" data-id="6"><input type="checkbox" class="todo-checkbox" checked/><span class="todo-text">Review pull requests</span><button class="btn-delete" disabled title="Cannot delete completed items">Delete </button></li></ul><div class="stats">6 total| 4 active| 2 completed</div></div><style> .highlight_box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 1rem;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); } </style><script> function init_app() { const appName = 'Todo';
    console.log(`${appName} app initialized!`);

    document.querySelectorAll('.todo-checkbox').forEach((cb, index) => {
        cb.addEventListener('change', (e) => {
            const item = e.target.closest('.todo-item');
            item.classList.toggle('completed', e.target.checked);
            console.log(`Toggled item ${index}`);
        });
    });

    document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (!btn.disabled) {
                const item = e.target.closest('.todo-item');
                item.style.opacity = '0';
                setTimeout(() => item.remove(), 300);
            }
        });
    }); } /* Initialize on load */ document.addEventListener('DOMContentLoaded', init_app); </script></body></html>
